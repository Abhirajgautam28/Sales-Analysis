name: Build and publish Docker image

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry (PAT if provided)
        if: ${{ env.GHCR_PAT != '' }}
        run: |
          echo "Logging in to ghcr.io using provided PAT"
          echo "${{ env.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Login to GitHub Container Registry (GITHUB_TOKEN fallback)
        if: ${{ env.GHCR_PAT == '' }}
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> $GITHUB_ENV
          else
            # For PRs build a local image tag we can run in the runner
            echo "IMAGE=sales-analysis:pr-${GITHUB_RUN_ID}" >> $GITHUB_ENV
          fi

      - name: Build (push on main, load on PR)
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            docker buildx build --platform linux/amd64 --tag "$IMAGE" --push .
          else
            # --load loads image into the runner's docker daemon so we can run it
            docker buildx build --platform linux/amd64 --tag "$IMAGE" --load .
          fi

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    env:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to GitHub Container Registry (PAT if provided)
        if: ${{ env.GHCR_PAT != '' }}
        run: |
          echo "Logging in to ghcr.io using provided PAT"
          echo "${{ env.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Login to GitHub Container Registry (GITHUB_TOKEN fallback)
        if: ${{ env.GHCR_PAT == '' }}
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> $GITHUB_ENV

      - name: Pull image (push runs only)
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            docker pull "$IMAGE"
          else
            echo "Skipping docker pull for PR build (image loaded locally)."
          fi

      - name: Run container
        run: |
          docker run -d --name sales_app -p 8501:8501 "$IMAGE" || (docker logs sales_app || true; exit 1)

      - name: Wait for app and smoke-test HTTP
        run: |
          set -e
          echo "Waiting for Streamlit to become available on http://localhost:8501 ..."
          ATTEMPTS=30
          SLEEP=2
          for i in $(seq 1 $ATTEMPTS); do
            if curl -fsS http://localhost:8501/ > /dev/null 2>&1; then
              echo "App responded on attempt $i"
              break
            fi
            echo "Attempt $i/$ATTEMPTS - not ready; sleeping $SLEEP seconds"
            sleep $SLEEP
            if [ $i -eq $ATTEMPTS ]; then
              echo "App did not respond after $ATTEMPTS attempts"
              docker logs sales_app || true
              docker stop sales_app || true
              docker rm sales_app || true
              exit 1
            fi
          done

      - name: Stop and remove container
        if: always()
        run: |
          docker stop sales_app || true
          docker rm sales_app || true
